[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopsmith"
version = "0.1.0"
description = "A CLI coding agent built from scratch in Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loopsmith = "loopsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Files that are not Python but belong to the package: the sandbox image's
# Dockerfile. Without this, an installed copy of loopsmith would lack it.
[tool.setuptools.package-data]
"loopsmith.sandbox" = ["*.Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
